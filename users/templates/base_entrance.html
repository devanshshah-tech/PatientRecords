{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>{% block title %}Patient records{% endblock %}</title>
  <link rel="icon" href="{% static 'favicon.ico' %}" sizes="any">
  <link rel="stylesheet" href="{% static 'users/app.css' %}">
</head>
<body>
  <header><a href="{% url 'index' %}" class="brand">Patient Records</a><span>Patient documentation</span></header>
  <main>
    <div class="hospital-identity"><img src="{% static 'Hospital_Logo.jpg' %}" alt="Anand Hospital" width="702" height="198"></div>
    {% for message in messages %}<p role="status" class="notice">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer>Use only for authorized clinical documentation. Obtain consent before taking photographs. <a href="{% url 'privacy_policy' %}">Privacy policy</a></footer>
</body>
</html>
